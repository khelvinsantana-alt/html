    <style>
        :root {
            --fundo: #b3c6e3;
            --fundo-claro: #e3ecf9;
            --azul: #06005e;
            --azul-medio: #2a1fd0;
            --branco: #ffffff;
            --texto: #0d0a3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Sora", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
            color: var(--texto);
            background-color: var(--fundo);
            background-image:
                radial-gradient(circle at 12% 8%, var(--fundo-claro) 0, transparent 42%),
                radial-gradient(circle at 92% 92%, #8fa9d6 0, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        /* ---------- Cartão central ---------- */
        .pagina {
            width: 100%;
            max-width: 880px;
            background: rgba(255, 255, 255, 0.55);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 36px;
            box-shadow: 0 30px 70px rgba(6, 0, 94, 0.22);
            padding: 56px 40px 32px;
            text-align: center;
        }

        /* ---------- Cabeçalho ---------- */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .foto {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 6px solid var(--branco);
            box-shadow:
                0 0 0 6px var(--azul),
                0 20px 44px rgba(6, 0, 94, 0.4);
            overflow: hidden;
            background: var(--azul);
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 35%;
            display: block;
        }

        header h1 {
            margin-top: 36px;
            font-size: clamp(1.8rem, 5vw, 2.9rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            color: var(--azul);
        }

        header p {
            margin-top: 14px;
            max-width: 46ch;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .linha {
            width: 64px;
            height: 5px;
            margin: 28px auto 0;
            border-radius: 5px;
            background: var(--azul);
        }

        /* ---------- Aulas ---------- */
        main { margin-top: 36px; }

        main h2 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--azul);
            margin-bottom: 22px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        nav a {
            flex: 0 1 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 18px 12px 16px;
            text-decoration: none;
            color: var(--branco);
            background: linear-gradient(160deg, var(--azul-medio) -40%, var(--azul) 70%);
            border-radius: 22px;
            font-size: 0.85rem;
            font-weight: 400;
            box-shadow: 0 8px 18px rgba(6, 0, 94, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        nav a b {
            font-size: 1.9rem;
            font-weight: 800;
            line-height: 1.1;
        }

        nav a:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 28px rgba(6, 0, 94, 0.38);
        }

        nav a:focus-visible {
            outline: 3px solid var(--branco);
            outline-offset: 3px;
            box-shadow: 0 0 0 6px var(--azul);
        }

        /* ---------- Rodapé ---------- */
        footer {
            margin-top: 48px;
            padding-top: 22px;
            border-top: 2px solid rgba(6, 0, 94, 0.2);
            font-size: 0.88rem;
            line-height: 1.7;
        }

        /* ---------- Celular ---------- */
        @media (max-width: 600px) {
            .pagina { padding: 40px 20px 24px; border-radius: 28px; }
            .foto { width: 160px; height: 160px; }
            nav { gap: 12px; }
            nav a { flex: 0 0 calc(50% - 6px); }
        }

        @media (prefers-reduced-motion: reduce) {
            nav a { transition: none; }
            nav a:hover { transform: none; }
        }
    </style>
</head>
